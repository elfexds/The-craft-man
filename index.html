<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>The Craft Man</title>

<!-- BASE PATH (NO @main) -->
<base href="https://cdn.jsdelivr.net/gh/elfexds/The-craft-man/">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

/* GAME HOLDER */
#unity-container {
  position: fixed;
  inset: 0;
}

#unity-canvas {
  width: 100%;
  height: 100%;
  background: #231F20;
}

/* LOADER */
#loader {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

#title {
  color: #fff;
  font-size: 40px;
  letter-spacing: 4px;
  margin-bottom: 12px;
}

#logo {
  width: 180px;
  margin-bottom: 8px;
}

#by {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 24px;
}

/* LOADING BAR */
#bar-bg {
  width: 360px;
  height: 14px;
  background: #111;
  border-radius: 20px;
  overflow: hidden;
}

#bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #00f0ff, #00ff88);
  transition: width .25s ease;
}
</style>
</head>

<body>

<div id="unity-container">
  <canvas id="unity-canvas"></canvas>
</div>

<div id="loader">
  <div id="title">THE CRAFT MAN</div>

  <!-- HOHO GAMES LOGO (JSDELIVR) -->
  <img id="logo" src="https://cdn.jsdelivr.net/gh/elfexds/liftbreak/logo.png">

  <div id="by">by HOHO GAMES</div>

  <div id="bar-bg"><div id="bar"></div></div>
</div>

<!-- UNITY LOADER -->
<script src="UnityLoader.js"></script>
<script>
const canvas = document.getElementById("unity-canvas");
const bar = document.getElementById("bar");
const loader = document.getElementById("loader");

createUnityInstance(canvas, {
  dataUrl: "game.data.unityweb",
  frameworkUrl: "game.wasm.framework.unityweb",
  codeUrl: "game.wasm.code.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "HOHO GAMES",
  productName: "The Craft Man",
  productVersion: "1.0"
}, (progress) => {
  bar.style.width = Math.max(progress * 100, 5) + "%";
}).then(() => {
  loader.style.display = "none";
}).catch((err) => {
  alert(err);
});
</script>

</body>
</html>
